<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket recorder</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 18px; } h2 { font-size: 15px; margin: 0 0 8px; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #888; background: #fff; cursor: pointer; }
  button.primary { background: #c00; color: #fff; border-color: #c00; }
  button:disabled { opacity: .4; cursor: default; }
  input, select { font: inherit; padding: 6px; }
  .ok { color: #080; } .muted { color: #777; font-size: 12px; } .notice { color: #a16207; margin-left: 8px; } .rec { color: #c00; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; } td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  code { font-size: 12px; } pre { background: #f6f6f6; padding: 8px; font-size: 12px; overflow: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Ticket recorder</h1>

<section>
  <h2>Work Profiles</h2>
  <div class="muted">Dedicated Chromes for Elkjøp work. Open one and log in to Jira, SharePoint, Coremedia… once, by hand; it stays logged in. Only open ones can be recorded.</div>
  <table>
    <thead><tr><th>Work Profile</th><th>Port</th><th>Status</th><th></th></tr></thead>
    <tbody id="profiles"></tbody>
  </table>
  <div class="row">
    <input id="new-profile" placeholder="elkjop">
    <button id="create-profile">Create Work Profile</button>
    <span id="profile-notice" class="notice"></span>
  </div>
</section>

<section>
  <h2>Ticket</h2>
  <div class="row">
    <input id="ticket-id" placeholder="PM-32803">
    <button id="open-ticket">Create or open</button>
    <span id="ticket-notice" class="notice"></span>
  </div>
  <div class="row" id="record-row" hidden>
    <b id="ticket-label"></b>
    Work Profile <select id="profile-select"></select>
    <button id="start" class="primary">● Start recording</button>
    <button id="stop">■ Finish</button>
    <span id="status"></span>
  </div>
</section>

<section>
  <b>Live events</b> (<span id="count">0</span>)
  <table><thead><tr><th>#</th><th>t</th><th>tab</th><th>type</th><th>locator / detail</th><th>screenshot</th></tr></thead><tbody id="events"></tbody></table>
  <pre id="error" hidden></pre>
</section>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (method, url, body) => {
  const r = await fetch(url, { method, headers: { 'content-type': 'application/json' }, body: body && JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) {
    $('error').hidden = false;
    $('error').textContent = data.error;
    throw new Error(data.error);
  }
  $('error').hidden = true;
  return data;
};
const flash = (id, msg) => { $(id).textContent = msg; setTimeout(() => ($(id).textContent = ''), 4000); };

let ticket = null;   // Ticket open in the panel
let lastProfile = null; // Work Profile that Ticket was last recorded with
let rec = {};        // latest /api/state
let profiles = [];
let chosenProfile = null;

function detail(e) {
  const loc = e.target?.locator ? `<code>${esc(e.target.locator)}</code>` : '';
  const extra = e.type === 'navigate' ? e.url : e.key ?? (e.value !== undefined ? `= ${JSON.stringify(e.value)}` : '');
  const text = e.text ? `“${esc(e.text.slice(0, 80))}”` : '';
  return [loc, esc(extra), text].filter(Boolean).join(' ');
}

function render() {
  const recording = rec.status !== 'idle';
  if (recording && rec.ticket) ticket = rec.ticket;

  $('profiles').innerHTML = profiles.map((p) => {
    const busy = recording && rec.profile === p.name;
    return `<tr>
      <td><b>${esc(p.name)}</b>${busy ? ' <span class="rec">● REC</span>' : ''}<div class="muted">${esc(p.dir)}</div></td>
      <td>${p.port}</td>
      <td>${p.open ? '<span class="ok">open</span>' : '<span class="muted">closed</span>'}</td>
      <td style="white-space:nowrap">
        <button data-pact="open" data-name="${esc(p.name)}" ${p.open ? 'disabled' : ''}>Open</button>
        <button data-pact="close" data-name="${esc(p.name)}" ${!p.open || busy ? 'disabled' : ''}
          title="${busy ? 'Being recorded: finish the Recording Session first' : 'Quits this Chrome; logins are saved'}">Close</button>
      </td></tr>`;
  }).join('') || '<tr><td colspan="4" class="muted">No Work Profiles yet.</td></tr>';

  $('open-ticket').disabled = recording;
  $('record-row').hidden = !ticket;
  $('ticket-label').textContent = ticket ?? '';
  const open = profiles.filter((p) => p.open);
  if (recording) chosenProfile = rec.profile;
  // Default to the one last used for this Ticket, while it is open; otherwise the first open one.
  else if (!open.some((p) => p.name === chosenProfile)) {
    chosenProfile = open.some((p) => p.name === lastProfile) ? lastProfile : open[0]?.name ?? null;
  }
  $('profile-select').innerHTML = open.length
    ? open.map((p) => `<option ${p.name === chosenProfile ? 'selected' : ''}>${esc(p.name)}</option>`).join('')
    : '<option>Open a Work Profile first</option>';
  $('profile-select').disabled = recording || !open.length;
  $('start').disabled = recording || !chosenProfile;
  $('stop').disabled = rec.status !== 'recording';
  $('status').innerHTML = recording
    ? `<span class="rec">● recording session ${rec.session} · ${Math.round((Date.now() - rec.startedAt) / 1000)}s</span>` : '';

  $('count').textContent = rec.eventCount ?? 0;
  $('events').innerHTML = (rec.events ?? []).slice().reverse().map((e) =>
    `<tr><td>${e.seq}</td><td>${(e.t / 1000).toFixed(1)}s</td><td>${e.tab ?? ''}</td><td>${e.type}</td><td>${detail(e)}</td><td>${e.screenshot ? '✓' : ''}</td></tr>`).join('');
}

async function refresh() {
  [rec, profiles] = await Promise.all([api('GET', '/api/state'), api('GET', '/api/profiles')]);
  render();
}

$('open-ticket').onclick = async () => {
  const id = $('ticket-id').value.trim();
  if (!id) return;
  const t = await api('POST', '/api/tickets', { ticket: id });
  ticket = t.ticket;
  lastProfile = t.lastProfile;
  chosenProfile = null;
  $('ticket-id').value = '';
  flash('ticket-notice', t.existed ? `${t.ticket} already exists, opened it.` : `${t.ticket} created.`);
  refresh();
};
$('ticket-id').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('open-ticket').click();
});
$('profile-select').onchange = (e) => (chosenProfile = e.target.value);
$('profiles').onclick = async (e) => {
  const b = e.target.closest('button[data-pact]');
  if (!b) return;
  b.disabled = true;
  b.textContent = b.dataset.pact === 'open' ? 'Opening…' : 'Closing…';
  await api('POST', `/api/profiles/${b.dataset.pact}`, { name: b.dataset.name }).catch(() => {});
  refresh();
};
$('create-profile').onclick = async () => {
  const name = $('new-profile').value.trim();
  if (!name) return;
  await api('POST', '/api/profiles', { name });
  $('new-profile').value = '';
  flash('profile-notice', `${name} created. Open it and log in to the Elkjøp tools once.`);
  refresh();
};
$('new-profile').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('create-profile').click();
});
$('start').onclick = () => api('POST', '/api/start', { ticket, profile: chosenProfile }).then(refresh);
$('stop').onclick = () => api('POST', '/api/stop').then(() => {
  lastProfile = rec.profile;
  refresh();
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
